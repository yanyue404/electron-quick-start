directories:
  output: release
  buildResources: build
appId: com.electron.quick-start
productName: Electron Quick Start
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Electron Quick Start
mac:
  target:
    - dmg
  icon: public/icon.png
linux:
  target:
    - AppImage
  icon: public/icon.png
electronVersion: 28.3.3
